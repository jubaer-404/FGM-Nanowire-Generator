<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Atom Orbits (FGM graded layers) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Orbit 1 -->
    <ellipse rx="170" ry="72" transform="rotate(30)" fill="none" stroke="url(#ringGrad1)" stroke-width="8" opacity="0.85" />
    <!-- Orbit 2 -->
    <ellipse rx="170" ry="72" transform="rotate(90)" fill="none" stroke="url(#ringGrad2)" stroke-width="8" opacity="0.85" />
    <!-- Orbit 3 -->
    <ellipse rx="170" ry="72" transform="rotate(150)" fill="none" stroke="url(#ringGrad1)" stroke-width="8" opacity="0.85" />

    <!-- Orbital Atom Spheres (Base + Graded elements) -->
    <!-- Copper -->
    <circle cx="147" cy="85" r="18" fill="#c27847" stroke="#ffffff" stroke-width="3" />
    <!-- Nickel -->
    <circle cx="-147" cy="-85" r="17" fill="#8a9ea7" stroke="#ffffff" stroke-width="3" />
    <!-- Iron -->
    <circle cx="0" cy="170" r="17" fill="#5c6b73" stroke="#ffffff" stroke-width="3" />
    <!-- Gold (Graded additive) -->
    <circle cx="0" cy="-170" r="22" fill="#fbbf24" stroke="#ffffff" stroke-width="3.5" />
    <!-- Aluminum -->
    <circle cx="-147" cy="85" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <!-- Platinum -->
    <circle cx="147" cy="-85" r="18" fill="#e2e8f0" stroke="#ffffff" stroke-width="3" />

    <!-- Central Core Nanostructure Cluster -->
    <circle cx="0" cy="0" r="50" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="4" />
    <circle cx="-12" cy="-12" r="12" fill="#ffffff" opacity="0.35" />
  </g>

  <!-- Typography / Label Tag -->
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#38bdf8" letter-spacing="4">
    FGM BUILDER
  </text>
</svg>
